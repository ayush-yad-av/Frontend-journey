<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-box</title>
    <style>
        .flex-container{
            display: flex;
            flex-wrap: wrap;
            
            align-items: center;
        }
        .flex-item{
            width: 75px;
            height: 75px;
            background-color: lightskyblue;
            border: 2px solid darkblue;
            text-align: center;
            font-size: 2em;
            color:white;
            font-weight: bold;
            line-height: 1.4;
            
        }
        #flex-box-1{background-color: lightpink;}
        #flex-box-2{background-color: rgb(204, 43, 68);}
        #flex-box-3{background-color: rgb(158, 201, 40);}
        #flex-box-4{background-color: rgb(12, 141, 120);}
        #flex-box-5{background-color: rgb(148, 36, 53);}
        #flex-box-6{background-color: rgb(153, 48, 139);}
    </style>
</head>
<body>
    <div class=" f1 flex-container">
        <div class="flex-item" id="flex-box-1">1</div>
        <div class="flex-item" id="flex-box-2">2</div>
        <div class="flex-item" id="flex-box-3">3</div>
        <div class="flex-item" id="flex-box-4"> 4</div>
        <div class="flex-item" id="flex-box-5">5</div>
    </div>

    
</body>
</html>
